name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    env:
      OS: ${{ matrix.os }}
      COMPILER: ${{ matrix.compiler }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Cache Hermes data
      id: cache-hermes-data
      uses: actions/cache@v4
      with:
        path: ~/hermes_cache
        key: hermes-data-v1
        restore-keys: hermes-data-v1

    - name: Download and extract Hermes data
      run: |
        set -e
        TARBALL=~/hermes_cache/hermes-data.tar.gz
        DATADIR=${{github.workspace}}/build/data
        mkdir -p ~/hermes_cache
        mkdir -p ${{github.workspace}}/build
        if [ -f "$TARBALL" ]; then
          echo "Data tarball found in cache, skipping download."
        else
          echo "Downloading hermes-data.tar.gz from Zenodo..."
          curl -L --retry 3 --retry-delay 5 --fail \
            "https://zenodo.org/record/20544178/files/hermes-data.tar.gz" \
            -o "$TARBALL"
          echo "Download complete."
        fi
        echo "Extracting data into build directory..."
        tar -xzf "$TARBALL" -C ${{github.workspace}}/build
        if [ ! -f "$DATADIR/Interactions/AAfrag2021Gamma.txt.gz" ]; then
          echo "ERROR: expected data file not found after extraction!"
          ls "$DATADIR/Interactions/" || echo "(Interactions directory missing)"
          exit 1
        fi
        echo "Data files verified."

    - name: Install dependencies on Ubuntu
      if: ${{ contains(env.OS, 'ubuntu') }}
      run: sudo apt-get install -y libgsl-dev libfftw3-dev libcfitsio-dev libmuparser-dev libhdf5-dev
      
    - name: Install dependencies on MacOS
      if: ${{ contains(env.OS, 'macos') }}
      run: |
         HOMEBREW_NO_AUTO_UPDATE=1 brew install python3;
         HOMEBREW_NO_AUTO_UPDATE=1 brew install gsl;
         HOMEBREW_NO_AUTO_UPDATE=1 brew install cfitsio;
         HOMEBREW_NO_AUTO_UPDATE=1 brew install hdf5;
         HOMEBREW_NO_AUTO_UPDATE=1 brew install gcc;
         HOMEBREW_NO_AUTO_UPDATE=1 brew link --overwrite gcc;
         HOMEBREW_NO_AUTO_UPDATE=1 brew link --overwrite python;

    - name: Configure CMake
      env:
        CXX: ${{ matrix.cxx }}
        CC: ${{ matrix.cc }}
      run: |
        cmake -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DENABLE_TESTING=On \
          -DENABLE_PYTHON=True \
          -DDOWNLOAD_DATA=OFF
        
    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel

    - name: List tests
      working-directory: ${{github.workspace}}/build
      run: ctest -N -C ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest --output-on-failure -C ${{env.BUILD_TYPE}} --timeout 1200

    - name: AAfrag regression test
      working-directory: ${{github.workspace}}/build
      run: ./testInteractions --gtest_filter=Interactions.AAfrag
      
