name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  BUILD_TYPE: Release
  HERMES_DATA_VERSION: 1.0.0
  HERMES_DATA_SHA256: cf7d27aef8eca54c00e194f5b56eb23f982e0e8c40a3db374308c98d90e801d6

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            python-version: '3.14'
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
            python-version: '3.13'
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
            python-version: '3.14'
    runs-on: ${{ matrix.os }}
    env:
      OS: ${{ matrix.os }}
      COMPILER: ${{ matrix.compiler }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache Hermes data
      id: cache-hermes-data
      uses: actions/cache@v4
      with:
        path: ~/hermes_cache
        key: hermes-data-${{ env.HERMES_DATA_VERSION }}-${{ env.HERMES_DATA_SHA256 }}

    - name: Download and extract Hermes data
      run: |
        set -e
        TARBALL=~/hermes_cache/hermes-data-${HERMES_DATA_VERSION}.tar.gz
        DATADIR=${{github.workspace}}/build/data
        mkdir -p ~/hermes_cache
        mkdir -p ${{github.workspace}}/build
        if [ -f "$TARBALL" ]; then
          echo "Data tarball found in cache, skipping download."
        else
          echo "Downloading HERMES data ${HERMES_DATA_VERSION} from GitHub Releases..."
          curl -L --retry 3 --retry-delay 5 --fail \
            "https://github.com/HERMES-SkyMaps/hermes-data/releases/download/v${HERMES_DATA_VERSION}/hermes-data-${HERMES_DATA_VERSION}.tar.gz" \
            -o "$TARBALL"
          echo "Download complete."
        fi
        python3 -c 'import hashlib, pathlib, sys; p = pathlib.Path(sys.argv[1]); actual = hashlib.sha256(p.read_bytes()).hexdigest(); expected = sys.argv[2]; assert actual == expected, f"checksum mismatch: {actual} != {expected}"' "$TARBALL" "$HERMES_DATA_SHA256"
        echo "Extracting data into build directory..."
        tar -xzf "$TARBALL" -C ${{github.workspace}}/build
        if [ ! -f "$DATADIR/Interactions/AAfrag2021Gamma.txt.gz" ]; then
          echo "ERROR: expected data file not found after extraction!"
          ls "$DATADIR/Interactions/" || echo "(Interactions directory missing)"
          exit 1
        fi
        if [ ! -f "$DATADIR/CosmicRays/DRAGON2/d2_base_min.gz" ]; then
          echo "ERROR: expected data file not found after extraction!"
          ls "$DATADIR/CosmicRays/DRAGON2/" || echo "(DRAGON2 directory missing)"
          exit 1
        fi
        if [ ! -f "$DATADIR/DarkMatter/PPPC4DMID/AtProduction_gammas.dat.gz" ]; then
          echo "ERROR: expected data file not found after extraction!"
          ls "$DATADIR/DarkMatter/PPPC4DMID/" || echo "(PPPC4DMID directory missing)"
          exit 1
        fi
        if [ ! -f "$DATADIR/GasDensity/Remy18/NHrings_Ts300K.fits.gz" ]; then
          echo "ERROR: expected data file not found after extraction!"
          ls "$DATADIR/GasDensity/Remy18/" || echo "(Remy18 directory missing)"
          exit 1
        fi
        echo "Data files verified."

    - name: Install dependencies on Ubuntu
      if: ${{ contains(env.OS, 'ubuntu') }}
      run: sudo apt-get install -y libgsl-dev libfftw3-dev libcfitsio-dev
      
    - name: Install dependencies on MacOS
      if: ${{ contains(env.OS, 'macos') }}
      run: |
         HOMEBREW_NO_AUTO_UPDATE=1 brew install gsl;
         HOMEBREW_NO_AUTO_UPDATE=1 brew install cfitsio;

    - name: Configure CMake
      env:
        CXX: ${{ matrix.cxx }}
        CC: ${{ matrix.cc }}
      run: |
        cmake -S ${{github.workspace}} -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DENABLE_TESTING=On \
          -DENABLE_PYTHON=True \
          -DDOWNLOAD_DATA=OFF \
          -DHERMES_INSTALL_DATA=OFF
        
    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel

    - name: List tests
      working-directory: ${{github.workspace}}/build
      run: ctest -N -C ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest --output-on-failure -C ${{env.BUILD_TYPE}} --timeout 1200

    - name: Test Python import
      working-directory: ${{github.workspace}}
      run: PYTHONPATH=${{github.workspace}}/build python3 -c "import pyhermes"

    - name: Test installed CMake package
      run: |
        cmake --install ${{github.workspace}}/build \
          --prefix ${{github.workspace}}/build/stage \
          --config ${{env.BUILD_TYPE}}
        cmake -S ${{github.workspace}}/test/package \
          -B ${{github.workspace}}/build/package-smoke \
          -DCMAKE_PREFIX_PATH=${{github.workspace}}/build/stage
        cmake --build ${{github.workspace}}/build/package-smoke --parallel
        ${{github.workspace}}/build/package-smoke/hermes_package_smoke
        PYTHON_VERSION=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
        PYTHONPATH=${{github.workspace}}/build/stage/lib/python${PYTHON_VERSION}/site-packages \
          python3 -c "import pyhermes"
        mkdir -p ${{github.workspace}}/build/stage/share/hermes/data/Interactions
        cp ${{github.workspace}}/build/data/Interactions/AAfrag2021Gamma.txt.gz \
          ${{github.workspace}}/build/stage/share/hermes/data/Interactions/
        ${{github.workspace}}/build/package-smoke/hermes_package_smoke \
          Interactions/AAfrag2021Gamma.txt.gz \
          ${{github.workspace}}/build/stage/lib/../share/hermes/data/Interactions/AAfrag2021Gamma.txt.gz

    - name: Build distributable archive
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.compiler == 'gcc' }}
      working-directory: ${{github.workspace}}/build
      run: cpack -G TGZ
